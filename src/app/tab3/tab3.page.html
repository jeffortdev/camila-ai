<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>History</ion-title>
    <ion-buttons slot="end">
      <ion-button
        *ngIf="(sessions$ | async)?.length"
        (click)="clearAll()"
        aria-label="Clear all sessions"
        color="danger">
        <ion-icon slot="icon-only" name="trash-outline" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div *ngIf="!(sessions$ | async)?.length" class="empty-state">
    <ion-icon name="chatbubbles-outline" class="empty-icon" aria-hidden="true"></ion-icon>
    <p>No saved conversations yet.</p>
  </div>

  <ion-list *ngIf="(sessions$ | async)?.length">
    <ion-item-sliding *ngFor="let session of sessions$ | async">
      <ion-item button (click)="openSession(session.id)" detail>
        <ion-label>
          <h2>{{ session.title }}</h2>
          <p>{{ session.messages.length }} message{{ session.messages.length !== 1 ? 's' : '' }} &middot; {{ session.modelId | modelName }}</p>
          <p class="date">{{ session.updatedAt | date:'short' }}</p>
        </ion-label>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deleteSession(session.id)" aria-label="Delete">
          <ion-icon slot="icon-only" name="trash" aria-hidden="true"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

</ion-content>
